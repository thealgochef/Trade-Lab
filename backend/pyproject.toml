[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trade-lab"
version = "0.1.0"
description = "Deterministic backend foundation for the Trade-Lab NQ workstation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "catboost>=1.2",
  "fastapi>=0.115",
  "orjson>=3.10",
  "pyarrow>=18.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "strategy-core @ git+https://github.com/thealgochef/Strategy-Core.git@fcff9f079467ee54b0768c5e07c4852f53e949c4",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
live = [
  # WEDGE fix floor (docs/archive/windows/WEDGE_CAPTURE.md): databento 0.79.0 is the first
  # release that marshals Live.start()/terminate() onto the SDK session loop instead of
  # writing to its transport from the calling thread (the silent post-drain wedge);
  # subscribe() still writes caller-thread as of 0.81.0, which the adapter facade
  # marshals itself (adapters/databento.py connect_session/_run_on_session_loop). The
  # SDK stays optional — tests run offline with fakes; the live host installs .[live].
  "databento>=0.79",
]
dev = [
  # starlette 1.x's TestClient backend (cold CI resolves starlette>=1.x, whose
  # testclient imports `httpx2 as httpx`); sole consumers are the TestClient tests,
  # so it is a test dependency, not a runtime one. CI installs .[dev].
  "httpx2>=2.3",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  # Ceiling matches SC/QL: ruff 0.16.0's default-rule expansion reds cold installs. This
  # tree is clean under 0.16 today (the explicit lint.select below shields it), so the
  # ceiling is prophylactic — it keeps all three repos on one linter across cold runs.
  "ruff>=0.8,<0.16",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/trade_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "benchmark: lightweight synthetic throughput smoke tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022"]
